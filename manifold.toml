[init]
session = "plugins/coding-agent/target/wasm32-unknown-unknown/release/manifold_coding_agent_plugin.component.wasm"
client = "plugins/coding-agent/target/wasm32-unknown-unknown/release/manifold_coding_agent_plugin.component.wasm"

[client.key-policy]
provider = "workspace"
path = "plugins/default-workspace/target/wasm32-unknown-unknown/release/manifold_default_workspace_plugin.wasm"

[module.dev]
enabled = false
kind = "fast-key-handler"
path = "examples/wasm-key-handler/target/wasm32-unknown-unknown/release/manifold_wasm_key_handler.wasm"
capabilities = [
  "shortcuts:handle",
  "apps:run-argv",
  "apps:startup",
  "workspace:focus-app-id",
  "workspace:close-focused-pane",
]

[startup.agent]
enabled = false
argv = ["foot", "--app-id", "pi-foot", "pi"]

[session.runner]
enabled = true
kind = "nix-develop"
