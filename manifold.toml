[module.dev]
enabled = true
kind = "fast-key-handler"
path = "examples/wasm-key-handler/target/wasm32-unknown-unknown/release/manifold_wasm_key_handler.wasm"
capabilities = [
  "shortcuts:handle",
  "apps:run-argv",
  "apps:startup",
  "workspace:focus-app-id",
  "workspace:close-focused-pane",
]

[startup.agent]
enabled = true
argv = ["foot", "--app-id", "manifold-codex", "codex", "--yolo"]

[startup.session-switcher]
enabled = true
realm = "presentation"
argv = ["python3", "apps/manifold-session-switcher.py", "--width", "300", "--sidebar-mode", "always"]

[session.runner]
enabled = true
kind = "nix-develop"

[module.master-layout]
enabled = false
kind = "fast-map-hook"
path = "examples/wasm-map-hook/target/wasm32-unknown-unknown/release/manifold_wasm_map_hook.wasm"
capabilities = [
  "layout:on-map",
]
