[init]
session = "examples/wasm-init-actor/target/wasm32-unknown-unknown/release/manifold_wasm_init_actor_example.component.wasm"

[module.default-workspace]
enabled = true
kind = "plugin"
path = "plugins/default-workspace/target/wasm32-unknown-unknown/release/manifold_default_workspace_plugin.wasm"
capabilities = [
  "shortcuts:handle",
  "apps:run-argv",
  "workspace:session",
  "workspace:layout",
]

[module.dev]
enabled = false
kind = "fast-key-handler"
path = "examples/wasm-key-handler/target/wasm32-unknown-unknown/release/manifold_wasm_key_handler.wasm"
capabilities = [
  "shortcuts:handle",
  "apps:run-argv",
  "apps:startup",
  "workspace:focus-app-id",
  "workspace:close-focused-pane",
]

[layout]
auto_split_visible_limit = 3

[startup.agent]
enabled = true
argv = ["foot", "--app-id", "pi-foot", "pi"]

[startup.session-switcher]
enabled = true
realm = "presentation"
argv = ["python3", "apps/manifold-session-switcher.py", "--width", "300"]

[session.runner]
enabled = true
kind = "nix-develop"
