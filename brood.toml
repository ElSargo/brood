[init]
backend = "plugins/worktree-manager/target/wasm32-unknown-unknown/release/brood_worktree_manager_plugin.component.wasm"

[client.key-policy]
provider = "workspace"
path = "plugins/default-workspace/target/wasm32-unknown-unknown/release/brood_default_workspace_plugin.wasm"

[module.dev]
enabled = false
kind = "fast-key-handler"
path = "examples/wasm-key-handler/target/wasm32-unknown-unknown/release/brood_wasm_key_handler.wasm"
capabilities = [
  "shortcuts:handle",
  "apps:run-argv",
  "apps:startup",
  "workspace:focus-app-id",
  "workspace:close-focused-pane",
]

[startup.terminal]
enabled = true
argv = ["foot"]

[session.runner]
enabled = true
kind = "nix-develop"
