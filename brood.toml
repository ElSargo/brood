[init]
session = "examples/wasm-init-actor/target/wasm32-unknown-unknown/release/brood_wasm_init_actor_example.component.wasm"
client = "plugins/session-switcher/target/wasm32-unknown-unknown/release/brood_session_switcher_plugin.component.wasm"

[client.key-policy]
provider = "workspace"
path = "plugins/default-workspace/target/wasm32-unknown-unknown/release/brood_default_workspace_plugin.wasm"

[module.dev]
enabled = false
kind = "fast-key-handler"
path = "examples/wasm-key-handler/target/wasm32-unknown-unknown/release/brood_wasm_key_handler.wasm"
capabilities = [
  "shortcuts:handle",
  "apps:run-argv",
  "apps:startup",
  "workspace:focus-app-id",
  "workspace:close-focused-pane",
]

[startup.agent]
enabled = true
argv = ["foot", "--app-id", "pi-foot", "pi"]

[session.runner]
enabled = true
kind = "nix-develop"
