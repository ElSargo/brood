[workspace]
members = ["crates/manifoldd", "crates/manifold-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
calloop = "0.14.4"
clap = { version = "4.6.1", features = ["derive"] }
image = "0.25.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "use_system_lib",
] }
thiserror = "2.0.18"
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "time"] }
wasmtime = "43.0.2"
wayland-egl = "0.32.11"
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "tokio"] }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
