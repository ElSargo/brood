[workspace]
exclude = ["crates/brood-package-manifest"]
default-members = ["crates/broodd"]
members = [
    "crates/brood-launch",
    "crates/brood-package-contract",
    "clients/brood-client",
    "crates/bmux",
    "crates/brood-capsuled",
    "crates/brood-cli",
    "crates/brood-computer-use",
    "crates/brood-dmabuf",
    "crates/brood-graphics",
    "crates/brood-theme",
    "crates/brood-ipc",
    "crates/brood-keybindings",
    "crates/brood-layout",
    "crates/brood-plugin-sdk",
    "crates/brood-protocol",
    "crates/brood-profiler",
    "crates/brood-remote",
    "crates/brood-transport",
    "crates/broodd",
    "crates/brood-wasm",
    "crates/brood-wayland-drop",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
brood-launch = { path = "crates/brood-launch" }
brood-package-contract = { path = "crates/brood-package-contract" }
anyhow = "1.0.102"
base64 = "0.22.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures = "0.3.32"
gbm = "0.18.0"
getrandom = "0.3.4"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2.186"
memmap2 = "0.9.10"
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
raw-window-handle = "0.6.2"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rustix = { version = "1.1.4", features = ["event", "net", "pipe", "process", "time"] }
brood-cli = { path = "crates/brood-cli" }
brood-computer-use = { path = "crates/brood-computer-use" }
brood-graphics = { path = "crates/brood-graphics" }
brood-ipc = { path = "crates/brood-ipc" }
brood-keybindings = { path = "crates/brood-keybindings" }
brood-layout = { path = "crates/brood-layout" }
brood-plugin-sdk = { path = "crates/brood-plugin-sdk" }
brood-protocol = { path = "crates/brood-protocol" }
brood-profiler = { path = "crates/brood-profiler" }
brood-transport = { path = "crates/brood-transport" }
brood-wayland-drop = { path = "crates/brood-wayland-drop" }
lyon_tessellation = "1.0.20"
num-traits = "0.2.19"
notify = "8.2.0"
pollster = "0.4.0"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
signal-hook = "0.3.18"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "use_system_lib",
] }
thiserror = "2.0.18"
tempfile = "3.27.0"
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"] }
wasmtime = { version = "46.0.1", features = ["component-model-async"] }
wasmtime-wasi = { version = "46.0.1", default-features = false, features = ["p1"] }
wiggle = "46.0.1"
wgpu = "30.0.0"
wgpu-hal = { version = "30.0.0", features = ["vulkan"] }
winit = "0.30.13"
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "tokio"] }
zstd = "0.13.3"

# Line tables retain useful backtraces without enormous local debug artifacts.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
split-debuginfo = "off"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
