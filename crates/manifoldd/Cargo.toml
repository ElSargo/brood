[package]
name = "manifoldd"
version = "0.1.0"
edition.workspace = true
default-run = "manifold"

[lib]
test = false
doctest = false

[[bin]]
name = "manifold"
path = "src/main.rs"
test = false

[[bin]]
name = "manifold-sessiond"
path = "src/bin/manifold-sessiond.rs"
test = false

[[bin]]
name = "manifold-runner-nix-develop"
path = "src/bin/manifold-runner-nix-develop.rs"
test = false

[features]
default = ["shm-fallback"]
shm-fallback = []

[dependencies]
anyhow.workspace = true
calloop.workspace = true
calloop-wayland-source.workspace = true
clap.workspace = true
image.workspace = true
manifold-cli.workspace = true
manifold-ipc.workspace = true
manifold-wasm = { path = "../manifold-wasm" }
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
smithay.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
wasmtime.workspace = true
wayland-egl.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
zbus.workspace = true

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "allow"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
