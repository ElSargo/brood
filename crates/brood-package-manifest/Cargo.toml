[package]
name = "brood-package-manifest"
version = "0.1.0"
edition = "2024"
description = "Typed package manifest model for Brood plugins"
license = "MIT OR Apache-2.0"

# Keep this foundation independently testable until the root workspace adopts it.
[workspace]

[dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
brood-package-contract = { path = "../brood-package-contract" }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.12"
serde_json = "1.0.150"
sha2 = "0.10.9"
anyhow = "1.0.102"
tempfile = "3.27.0"
wasmparser = "0.252.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28.0", features = ["signal", "process", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
