[package]
name = "brood-plugin-graphics-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pure-renderer"]
pure-renderer = ["brood-plugin-sdk/facets", "dep:serde", "dep:serde_json"]

[dependencies]
brood-graphics = { path = "../../crates/brood-graphics" }
brood-plugin-sdk = { path = "../../crates/brood-plugin-sdk", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wit-bindgen = "0.57.1"

[workspace]
