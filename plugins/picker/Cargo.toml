[package]
name = "brood-picker-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
brood-graphics = { path = "../../crates/brood-graphics" }
brood-plugin-sdk = { path = "../../crates/brood-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
