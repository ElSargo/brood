[package]
name = "brood-diff-viewer-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pure-renderer"]
pure-renderer = ["brood-plugin-sdk/facets"]

[dependencies]
brood-graphics = { path = "../../crates/brood-graphics" }
brood-plugin-sdk = { path = "../../crates/brood-plugin-sdk" }
brood-protocol = { path = "../../crates/brood-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
