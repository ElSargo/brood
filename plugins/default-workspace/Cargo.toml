[package]
name = "brood-default-workspace-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
brood-keybindings = { path = "../../crates/brood-keybindings" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
