[package]
name = "brood-terminal-ui-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pure-renderer"]
pure-renderer = ["brood-plugin-sdk/facets"]

[dependencies]
brood-graphics = { path = "../../crates/brood-graphics" }
brood-plugin-sdk = { path = "../../crates/brood-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
unicode-width = "0.2.2"

[profile.release]
panic = "abort"
lto = true

[workspace]
